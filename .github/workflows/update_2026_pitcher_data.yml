name: Update 2026 Pitcher Data

# Full Statcast + BRef refresh — recalculates UPS (~4× daily during the season).
on:
  schedule:
    - cron: "0 7 * * *"    # ~3 AM ET
    - cron: "0 13 * * *"   # ~9 AM ET
    - cron: "0 19 * * *"   # ~3 PM ET
    - cron: "0 1 * * *"    # ~9 PM ET
  workflow_dispatch:

concurrency:
  group: pitchers-2026-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pitchers-${{ hashFiles('scripts/requirements.txt', 'scripts/fetch_2026_pitcher_data.py') }}
          restore-keys: ${{ runner.os }}-pip-pitchers-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pybaseball requests

      - name: Fetch 2026 Statcast pitcher data
        run: python scripts/fetch_2026_pitcher_data.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/pitchers_2026.json \
                    public/data/pitchers_2026_meta.json \
                    public/data/last_updated_2026.txt
          if git diff --cached --quiet; then
            echo "No Statcast changes to commit."
            exit 0
          fi
          git commit -m "chore: auto-update 2026 pitcher Statcast data [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git pull --rebase origin main
          git push origin main
