name: Refresh MLB Live Pitcher Stats

# Fast MLB Stats API merge — keeps IP/ERA/K/BB current between full Statcast runs.
on:
  schedule:
    - cron: "30 */2 * * *"   # every 2 hours at :30 (offset from Statcast job)
  workflow_dispatch:

concurrency:
  group: mlb-pitcher-live-2026
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-pitchers-${{ hashFiles('scripts/requirements.txt', 'scripts/fetch_2026_pitcher_data.py') }}
          restore-keys: ${{ runner.os }}-pip-pitchers-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy requests pybaseball

      - name: Ensure base 2026 dataset exists
        run: |
          if [ ! -f public/data/pitchers_2026.json ]; then
            python scripts/fetch_2026_pitcher_data.py
          fi

      - name: Refresh MLB live pitching stats
        run: python scripts/refresh_mlb_pitcher_live.py

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f public/data/pitchers_2026.json \
                    public/data/pitchers_2026_meta.json \
                    public/data/last_updated_mlb_live_2026.txt
          if git diff --cached --quiet; then
            echo "No counting-stat changes to commit."
            exit 0
          fi
          git commit -m "chore: MLB live pitcher refresh [$(date -u '+%Y-%m-%d %H:%M UTC')]"
          git push
